<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Marks Form</title>
  <link rel="stylesheet" href="practical17.css">
</head>
<body>

  <div class="container">
    <h2>Student Marks Entry</h2>
    <form action="practical17_process.php" method="POST">

      <label>Student Name:</label>
      <input type="text" name="name" placeholder="Enter student name" required>

      <label>Subject 1 Marks:</label>
      <input type="number" name="m1" min="0" max="100" placeholder="0-100" required>

      <label>Subject 2 Marks:</label>
      <input type="number" name="m2" min="0" max="100" placeholder="0-100" required>

      <label>Subject 3 Marks:</label>
      <input type="number" name="m3" min="0" max="100" placeholder="0-100" required>

      <label>Subject 4 Marks:</label>
      <input type="number" name="m4" min="0" max="100" placeholder="0-100" required>

      <label>Subject 5 Marks:</label>
      <input type="number" name="m5" min="0" max="100" placeholder="0-100" required>

      <button type="submit">Submit</button>
    </form>
  </div>

</body>
</html>
