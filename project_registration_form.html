<!DOCTYPE html>
<html>
<head>
  <title>Project Competition Registration</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; padding: 40px; }
    .form-box { background: white; padding: 28px; width: 420px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    h2 { text-align: center; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input[type="text"], input[type="email"], select, textarea {
      width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
    }
    input[type="submit"] { margin-top: 20px; width: 100%; padding: 10px; background: #2c7be5; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; }
    input[type="submit"]:hover { background: #1a5cbf; }
  </style>
</head>
<body>
<div class="form-box">
  <h2>Project Competition Registration</h2>
  <form action="project_registration_process.php" method="POST">

    <label>Team Name</label>
    <input type="text" name="team_name" placeholder="Enter team name" required>

    <label>Leader Name</label>
    <input type="text" name="leader_name" placeholder="Enter leader's name" required>

    <label>Email</label>
    <input type="email" name="email" placeholder="Enter email" required>

    <label>Department</label>
    <select name="department">
      <option>Computer Engineering</option>
      <option>IT Engineering</option>
      <option>Electronics Engineering</option>
    </select>

    <label>Project Title</label>
    <input type="text" name="project_title" placeholder="Enter project title" required>

    <label>Project Description</label>
    <textarea name="description" rows="3" placeholder="Brief description..."></textarea>

    <input type="submit" value="Register">

  </form>
</div>
</body>
</html>
