<!DOCTYPE html>
<html>
<head>
  <title>Student Registration</title>
  <link rel="stylesheet" href="registration_with_validation.css">
</head>
<body>
<div class="form-box">
  <h2>Student Registration</h2>

  <div id="successMsg" class="success" style="display:none;">
    ✅ Registration Successful! Welcome aboard.
  </div>

  <form id="regForm">

    <label>Full Name</label>
    <input type="text" id="name" placeholder="Enter your full name">
    <span class="error" id="nameErr"></span>

    <label>Email</label>
    <input type="text" id="email" placeholder="Enter your email">
    <span class="error" id="emailErr"></span>

    <label>Password</label>
    <input type="password" id="password" placeholder="Min 6 characters">
    <span class="error" id="passErr"></span>

    <label>Confirm Password</label>
    <input type="password" id="confirm" placeholder="Re-enter password">
    <span class="error" id="confirmErr"></span>

    <label>Phone Number</label>
    <input type="text" id="phone" placeholder="10-digit mobile number">
    <span class="error" id="phoneErr"></span>

    <button type="button" onclick="validate()">Register</button>
  </form>
</div>

<script src="registration_with_validation.js"></script>
</body>
</html>
