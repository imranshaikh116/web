<!DOCTYPE html>
<html>
<head>
  <title>Student Marks Calculator</title>
  <link rel="stylesheet" href="marks_calculator.css">
</head>
<body>
<div class="container">
  <h2>Student Marks Calculator</h2>

  <label>Student Name</label>
  <input type="text" id="sname" placeholder="Enter student name">

  <label>Subject 1</label>
  <input type="number" id="s1" placeholder="Marks out of 100" min="0" max="100">

  <label>Subject 2</label>
  <input type="number" id="s2" placeholder="Marks out of 100" min="0" max="100">

  <label>Subject 3</label>
  <input type="number" id="s3" placeholder="Marks out of 100" min="0" max="100">

  <label>Subject 4</label>
  <input type="number" id="s4" placeholder="Marks out of 100" min="0" max="100">

  <label>Subject 5</label>
  <input type="number" id="s5" placeholder="Marks out of 100" min="0" max="100">

  <button onclick="calcResult()">Calculate</button>

  <div id="result" class="result-box" style="display:none;"></div>
</div>

<script src="marks_calculator.js"></script>
</body>
</html>
