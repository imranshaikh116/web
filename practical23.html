<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Marks Calculator</title>
  <link rel="stylesheet" href="practical23.css">
</head>
<body>

  <div class="container">
    <h2>Student Marks Calculator</h2>

    <label>Student Name:</label>
    <input type="text" id="sname" placeholder="Enter student name">

    <label>Subject 1 Marks:</label>
    <input type="number" id="s1" placeholder="Enter marks (0-100)" min="0" max="100">

    <label>Subject 2 Marks:</label>
    <input type="number" id="s2" placeholder="Enter marks (0-100)" min="0" max="100">

    <label>Subject 3 Marks:</label>
    <input type="number" id="s3" placeholder="Enter marks (0-100)" min="0" max="100">

    <label>Subject 4 Marks:</label>
    <input type="number" id="s4" placeholder="Enter marks (0-100)" min="0" max="100">

    <label>Subject 5 Marks:</label>
    <input type="number" id="s5" placeholder="Enter marks (0-100)" min="0" max="100">

    <button onclick="calcMarks()">Calculate</button>

    <div id="result"></div>
  </div>

  <script src="practical23.js"></script>
</body>
</html>
