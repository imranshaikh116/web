<!DOCTYPE html>
<html>
<head>
  <title>Student Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; padding: 40px; }
    .form-box { background: white; padding: 28px; width: 400px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    h2 { text-align: center; margin-bottom: 20px; }
    label { display: block; margin-top: 14px; font-weight: bold; font-size: 0.95em; }
    input[type="text"], input[type="email"], input[type="date"] {
      width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc;
      border-radius: 4px; box-sizing: border-box;
    }
    .radio-group { margin-top: 8px; }
    .radio-group label { font-weight: normal; display: inline; margin-right: 15px; }
    input[type="submit"] {
      margin-top: 22px; width: 100%; padding: 10px;
      background: #2c7be5; color: white; border: none; border-radius: 4px;
      font-size: 1em; cursor: pointer;
    }
    input[type="submit"]:hover { background: #1a5cbf; }
  </style>
</head>
<body>
<div class="form-box">
  <h2>Student Registration</h2>
  <form>

    <label>Full Name</label>
    <input type="text" placeholder="Enter your full name">

    <label>Email</label>
    <input type="email" placeholder="Enter your email">

    <label>Gender</label>
    <div class="radio-group">
      <input type="radio" name="gender"> <label>Male</label>
      <input type="radio" name="gender"> <label>Female</label>
      <input type="radio" name="gender"> <label>Other</label>
    </div>

    <label>Date of Birth</label>
    <input type="date">

    <input type="submit" value="Register">

  </form>
</div>
</body>
</html>
