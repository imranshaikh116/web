<!DOCTYPE html>
<html>
<head>
  <title>Student Marks Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; padding: 40px; }
    .form-box { background: white; padding: 28px; width: 380px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    h2 { text-align: center; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input[type="text"], input[type="number"] { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    input[type="submit"] { margin-top: 20px; width: 100%; padding: 10px; background: #2c7be5; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; }
    input[type="submit"]:hover { background: #1a5cbf; }
  </style>
</head>
<body>
<div class="form-box">
  <h2>Enter Student Marks</h2>
  <form action="student_marks_process.php" method="POST">

    <label>Student Name</label>
    <input type="text" name="name" placeholder="Enter student name" required>

    <label>Subject 1 Marks</label>
    <input type="number" name="m1" placeholder="Marks out of 100" min="0" max="100" required>

    <label>Subject 2 Marks</label>
    <input type="number" name="m2" placeholder="Marks out of 100" min="0" max="100" required>

    <label>Subject 3 Marks</label>
    <input type="number" name="m3" placeholder="Marks out of 100" min="0" max="100" required>

    <label>Subject 4 Marks</label>
    <input type="number" name="m4" placeholder="Marks out of 100" min="0" max="100" required>

    <label>Subject 5 Marks</label>
    <input type="number" name="m5" placeholder="Marks out of 100" min="0" max="100" required>

    <input type="submit" value="Calculate">
  </form>
</div>
</body>
</html>
